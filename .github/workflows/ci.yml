name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Serve the build we just produced and run the browser checks
      # against it. These used to point at https://paweldregan.com, which
      # meant a push was gated on the PREVIOUS deploy rather than on the
      # commit being tested: a regression sailed through, and a new page
      # failed the check until after it shipped. Checking dist/ tests the
      # artifact the deploy job is about to upload.
      - name: Start preview server
        run: |
          bun preview.ts &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up" >&2
          exit 1

      - name: End-to-end checks
        run: bun run verify http://localhost:4173

      - name: Check translations
        run: bun run check-locales http://localhost:4173

      - name: Stop preview server
        if: always()
        run: kill "$PREVIEW_PID" || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          chmod 644 "$HOME/.ssh/id_ed25519.pub"

      - name: Deploy with Buddy
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_HELLO }}
          MAIL_PASSWORD_HELLO: ${{ secrets.MAIL_PASSWORD_HELLO }}
          MAIL_PASSWORD_PAWEL: ${{ secrets.MAIL_PASSWORD_PAWEL }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: ./buddy deploy --prod --yes

      # The pre-deploy checks prove the artifact is good; this proves the
      # thing actually being served is. Retried, because the edge can take
      # a moment to pick up the new build.
      - name: Verify the live site
        run: |
          for attempt in 1 2 3; do
            sleep 20
            if bun run check-locales https://paweldregan.com; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
          done
          exit 1
