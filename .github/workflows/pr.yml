name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build site
        run: bun run build

      - name: Verify expected output
        run: |
          for f in index.html about.html races.html coaching.html 404.html sitemap.xml robots.txt favicon.svg; do
            test -s "dist/$f" || { echo "missing or empty: dist/$f"; exit 1; }
          done
